name: Books to a review branch
# Run by hand with the id of a finished "Build opening books" run. Copies its book artifacts
# into site/data/ on a new branch books/<run id>-<this run id> for review. main is never touched: the books
# reach the live site only when someone merges or copies them over after checking them.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a finished "Build opening books" run'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: book-*
          path: books
      - name: Place the books and push the review branch
        run: |
          mkdir -p site/data/club
          [ -f books/book-masters/masters.json ] && cp books/book-masters/masters.json site/data/masters.json
          for f in books/book-b*/b*.json; do cp "$f" site/data/club/; done
          ls -la site/data site/data/club
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "books/${{ inputs.run_id }}-${{ github.run_id }}"
          git add site/data/masters.json site/data/club
          git commit -m "Opening books from build run ${{ inputs.run_id }} (for review)"
          git push origin "books/${{ inputs.run_id }}-${{ github.run_id }}"
