name: Build a club book from several months
# Run by hand. For rare bands (2200+), one month of the Lichess open database doesn't give enough rated rapid/classical
# games inside the time limit, so this reads several months in parallel (one job per month, each stopping after
# `minutes`), sums the raw counts and prunes them with the usual book rules (tools/merge_club.py).
# Uploads `book-<band>`, the same artifact name "Build opening books" uses, so "Books to a review branch" takes its run id.
on:
  workflow_dispatch:
    inputs:
      band:
        description: 'Band id (file name)'
        default: 'b22'
      lo:
        description: 'Lowest average rating (inclusive)'
        default: '2200'
      hi:
        description: 'Highest average rating (exclusive)'
        default: '4000'
      months:
        description: 'Lichess open database months, space-separated YYYY-MM (one job each)'
        default: '2026-04 2026-05 2026-06 2026-07 2026-08 2026-09'
      games:
        description: 'Games kept per month at most'
        default: '150000'
      minutes:
        description: 'Stop reading each month after this many minutes'
        default: '110'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.m.outputs.months }}
    steps:
      - id: m
        run: echo "months=$(echo '${{ inputs.months }}' | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  month:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install chess==1.11.2 && sudo apt-get install -y -q zstd
      - name: Stream one month of the Lichess open database (https://database.lichess.org/, CC0)
        shell: bash
        run: |
          set +o pipefail
          timeout ${{ inputs.minutes }}m curl -sSL "https://database.lichess.org/standard/lichess_db_standard_rated_${{ matrix.month }}.pgn.zst" \
            | zstd -dc 2>/dev/null \
            | (cd tools && python3 build_club.py ../raw-${{ matrix.month }}.json --lo ${{ inputs.lo }} --hi ${{ inputs.hi }} --games ${{ inputs.games }} --raw)
          ls -la raw-${{ matrix.month }}.json
      - uses: actions/upload-artifact@v4
        with: { name: 'raw-${{ matrix.month }}', path: 'raw-${{ matrix.month }}.json', retention-days: 3 }

  merge:
    needs: month
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install chess==1.11.2
      - uses: actions/download-artifact@v4
        with: { pattern: 'raw-*', path: raws, merge-multiple: true }
      - name: Sum the months and prune into the book
        run: ls -la raws && cd tools && python3 merge_club.py ../${{ inputs.band }}.json ../raws/*.json && ls -la ../${{ inputs.band }}.json
      - uses: actions/upload-artifact@v4
        with: { name: 'book-${{ inputs.band }}', path: '${{ inputs.band }}.json', retention-days: 7 }
