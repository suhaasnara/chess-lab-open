name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard (nothing from the private kit may enter this repo)
        run: python3 tools/privacy_guard.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless tests
        run: cd tests && npm ci --no-audit --no-fund && npm test

  deploy:
    needs: guard-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
