name: CI
on:
  push:
    branches: [main, parity-1, positions, one-codebase, shared-screens, improvements, improvements-2, improvements-3, improvements-4, overnight-11nov, overnight-2, friend-pack, blind, analyze2, no-pack, audit-fixes]
  pull_request:
  workflow_dispatch:

jobs:
  guard-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard (nothing from the private kit may enter this repo)
        run: python3 tools/privacy_guard.py . && python3 tests/guard_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless tests
        run: cd tests && npm ci --no-audit --no-fund && npm test

  deploy:
    needs: guard-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Version the script and style links (no stale JS after a deploy)
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/index.html && grep -c "?v=${GITHUB_SHA::7}" site/index.html
      - name: Privacy guard on the exported build (the exact folder uploaded next; fails closed)
        run: python3 tools/privacy_guard.py --build site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
